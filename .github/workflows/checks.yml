name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      INSPECT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14"
      - name: Install sandbox executable
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: uv sync --frozen
      - run: uv run ruff check src scripts analysis tests environments
      - run: uv run pytest
      - name: Regenerate figures without inference
        run: |
          uv run python analysis/provider_pilot.py --render-only
          uv run python analysis/coding_integrity.py --render-only
      - run: uv run python scripts/check_evidence.py
